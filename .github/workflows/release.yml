name: Publish signed release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify tag and build release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout exact tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify VERSION, main ancestry, and signed annotated tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release/verify-github-release-tag.sh

      - name: Notify brrr that release validation started
        continue-on-error: true
        shell: bash
        env:
          BRRR_WEBHOOK_SECRET: ${{ secrets.BRRR_WEBHOOK_SECRET }}
          BRRR_WEBHOOK_URL: ${{ secrets.BRRR_WEBHOOK_URL }}
        run: |
          ./scripts/release/notify-brrr.sh \
            "Talvoro ${GITHUB_REF_NAME} release started" \
            'Signed tag verified. Building and validating all distributions.' \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            'active'

      - name: Validate release script syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/release/*.sh; do
            bash -n "$script"
          done
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/release/release_utils.py

      - name: Run release-packaging regression suite
        shell: bash
        run: ./scripts/release/test-release.sh

      - name: Build all release distributions
        shell: bash
        run: ./scripts/release/build-release.sh

      - name: Verify release distributions and checksums
        shell: bash
        run: ./scripts/release/verify-release.sh

      - name: Smoke-test Docker and Web Hosting packages
        shell: bash
        run: ./scripts/release/smoke-release-packages.sh

      - name: Upload verified release artifacts for publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: talvoro-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

      - name: Notify brrr if build/verification failed
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        env:
          BRRR_WEBHOOK_SECRET: ${{ secrets.BRRR_WEBHOOK_SECRET }}
          BRRR_WEBHOOK_URL: ${{ secrets.BRRR_WEBHOOK_URL }}
        run: |
          if [ -x ./scripts/release/notify-brrr.sh ]; then
            ./scripts/release/notify-brrr.sh \
              "Talvoro ${GITHUB_REF_NAME} release failed" \
              'Build, verification, or package smoke testing failed. Nothing was published.' \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              'active'
          fi

  publish:
    name: Sign, attest, and publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout exact tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-verify official signed release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release/verify-github-release-tag.sh

      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: talvoro-release-${{ github.ref_name }}
          path: dist

      - name: Verify downloaded release artifacts
        shell: bash
        run: ./scripts/release/verify-release.sh

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keylessly sign and verify release artifacts
        shell: bash
        run: ./scripts/release/sign-release-artifacts.sh

      - name: Generate GitHub build provenance attestations
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/talvoro-v*.zip
            dist/talvoro-v*.zip.sigstore.json
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sigstore.json

      - name: Create draft, upload complete asset set, and publish
        id: publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release/publish-github-release.sh

      - name: Notify brrr that release was published
        continue-on-error: true
        shell: bash
        env:
          BRRR_WEBHOOK_SECRET: ${{ secrets.BRRR_WEBHOOK_SECRET }}
          BRRR_WEBHOOK_URL: ${{ secrets.BRRR_WEBHOOK_URL }}
        run: |
          ./scripts/release/notify-brrr.sh \
            "Talvoro ${GITHUB_REF_NAME} published" \
            'All distributions, individual Sigstore signatures, checksum signature, and GitHub provenance were published successfully.' \
            "${{ steps.publish_release.outputs.release_url }}" \
            'active'

      - name: Notify brrr if signing/attestation/publish failed
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        env:
          BRRR_WEBHOOK_SECRET: ${{ secrets.BRRR_WEBHOOK_SECRET }}
          BRRR_WEBHOOK_URL: ${{ secrets.BRRR_WEBHOOK_URL }}
        run: |
          if [ -x ./scripts/release/notify-brrr.sh ]; then
            ./scripts/release/notify-brrr.sh \
              "Talvoro ${GITHUB_REF_NAME} publication failed" \
              'Artifact signing, provenance attestation, or GitHub Release publication failed.' \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              'active'
          fi
